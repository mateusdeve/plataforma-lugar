security:
    password_hashers:
        # Argon2id e não bcrypt: bcrypt resiste a ataque por CPU, mas GPUs e
        # ASICs o quebram bem mais rápido. Argon2id é `memory-hard` — exige
        # memória, que é cara de paralelizar em hardware dedicado.
        Lugar\Infrastructure\Seguranca\UsuarioAutenticado:
            algorithm: auto

    providers:
        usuarios:
            id: Lugar\Infrastructure\Seguranca\ProvedorDeUsuarios

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Cadastro e login não exigem token — é onde o token nasce.
        publico:
            pattern: ^/api/auth/(cadastro|login|refresh)
            security: false

        # ═══════════════════════════════════════════════════════════════════
        # O webhook fica FORA do firewall porque quem o chama é uma máquina
        # que não tem conta aqui — não existe token para ela apresentar.
        #
        # Isso não o deixa desprotegido: a credencial dele é a assinatura HMAC
        # sobre o corpo, conferida antes de qualquer processamento
        # (AssinaturaHmac). É autenticação, só que de mensagem em vez de
        # usuário. Sem o segredo configurado, o endpoint recusa tudo.
        # ═══════════════════════════════════════════════════════════════════
        webhooks:
            pattern: ^/api/webhooks/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: usuarios
            jwt: ~

    access_control:
        # A vitrine é pública: quem ainda não tem conta precisa ver os eventos.
        - { path: ^/api/eventos, roles: PUBLIC_ACCESS, methods: [GET] }
        # Tudo que ESCREVE em /api/eventos — criar, publicar, cancelar,
        # excluir — é do organizador. A linha de cima já capturou os GET,
        # então esta só alcança os outros métodos.
        - { path: ^/api/eventos, roles: ROLE_ORGANIZADOR }
        - { path: ^/api/organizador, roles: ROLE_ORGANIZADOR }

        # ═══════════════════════════════════════════════════════════════════
        # A porta exige estar autenticado — e SÓ isso, aqui.
        #
        # Quem valida ingresso é a portaria escalada OU o organizador dono, e
        # essa decisão depende do EVENTO: nenhuma lista de papéis expressa
        # "esta pessoa, nesta porta". Quem decide é o PortariaVoter, chamado
        # pelo controller com o evento em mãos.
        #
        # Esta linha existe para a diferença entre 401 e 403 continuar
        # verdadeira: sem ela, a requisição anônima chegaria ao Voter, seria
        # recusada e viraria 403 — dizendo "você não pode" a quem sequer se
        # identificou, e mandando alguém já logado tentar logar de novo.
        # ═══════════════════════════════════════════════════════════════════
        - { path: ^/api/ingressos, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/portaria, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Nos testes o custo do Argon2id domina o tempo da suíte sem provar
            # nada — o algoritmo já é exercitado em produção.
            Lugar\Infrastructure\Seguranca\UsuarioAutenticado:
                algorithm: plaintext
                ignore_case: false
