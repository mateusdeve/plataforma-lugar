framework:
    messenger:
        transports:
            # Doctrine como transporte no MVP (PRD §7.1): uma peça a menos
            # para operar. Trocar por AMQP depois é mudar esta linha.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

        routing:
            # O e-mail de confirmação (PLAN 5.6). Vai para `async` porque
            # ninguém que acabou de pagar deve esperar um SMTP responder: a
            # requisição termina quando os ingressos existem, e o aviso sai
            # depois, no worker.
            #
            # Despachado DENTRO da transação da confirmação, o que com
            # transporte `doctrine://` dá outbox de graça — ver
            # Infrastructure/Notificacao/NotificadorPorMensageria.
            Lugar\Infrastructure\Notificacao\EnviarConfirmacaoDeCompra: async

            # Os eventos de domínio da fase 1.5 (ReservaCriada, LoteEsgotado,
            # IngressoUtilizado) nunca foram criados; a fase 5 orquestra no
            # caso de uso, dentro de uma transação só. Se um barramento de
            # eventos entrar depois, é aqui que ele aparece.
